<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matrix Rain — 3D Space</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
  nav {
    position: fixed;
    top: 10px;
    left: 12px;
    z-index: 10;
    font: 12px monospace;
  }
  nav a {
    color: #0f8;
    opacity: 0.4;
    text-decoration: none;
    margin-right: 12px;
  }
  nav a:hover { opacity: 1; }
  nav a.here { opacity: 0.9; text-decoration: underline; }
</style>
</head>
<body>
<nav>
  <a href="index.html">baseline</a><a href="layers.html">layers</a><a href="tilt.html">tilt</a><a class="here" href="space.html">3d space</a><a href="mask.html">mask</a>
</nav>
<canvas id="rain"></canvas>
<script>
(() => {
  'use strict';

  // True 3D rain: each stream lives at a fixed depth z in world space and is
  // perspective-projected every frame. Glyph size, on-screen speed, and fog
  // dimming all fall out of the projection — near streams are huge, fast and
  // bright; far ones tiny, slow and faint. A slow camera sway adds parallax.

  const canvas = document.getElementById('rain');
  const ctx = canvas.getContext('2d');

  const KATAKANA = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ';
  const DIGITS   = '0123456789';
  const LATIN    = 'Z:・."=*+-<>¦|';
  const GLYPHS   = (KATAKANA + DIGITS + LATIN).split('');

  const FPS = 30;
  const FRAME_MS = 1000 / FPS;
  const STREAM_COUNT = 260;
  const Z_NEAR = 0.6;          // closest allowed depth
  const Z_FAR = 5;             // furthest depth (heaviest fog)
  const GLYPH_WORLD = 0.045;   // glyph height in world units (size on screen = this * focal / z)
  const MIN_SPEED = 0.006;     // fall speed in world units per frame
  const MAX_SPEED = 0.020;
  const SWAY = 0.35;           // camera sway amplitude in world units (0 disables)
  const MUTATE_CHANCE = 0.05;  // chance per frame that a stream flickers one trail glyph

  let streams = [];
  let width = 0, height = 0, dpr = 1, focal = 0, cx = 0, cy = 0;
  let frame = 0;

  function randomGlyph() {
    return GLYPHS[(Math.random() * GLYPHS.length) | 0];
  }

  function spawnY(z) {
    // place the head above the top of the screen by a random margin
    return -(cy + Math.random() * height) * z / focal;
  }

  function makeStream(z) {
    const trailLen = 14 + (Math.random() * 16) | 0;
    const chars = [];
    for (let i = 0; i < trailLen; i++) chars.push(randomGlyph());
    return {
      z,
      // spread x so each depth roughly covers the screen width (recomputed vs
      // current focal at spawn; harmless if the window has resized since)
      x: 0, // set below once focal is known
      y: 0,
      speed: MIN_SPEED + Math.random() * (MAX_SPEED - MIN_SPEED),
      chars,
      lastStep: 0,
    };
  }

  function placeStream(s) {
    const halfSpan = (width / 2 + 40) * s.z / focal;
    s.x = (Math.random() * 2 - 1) * halfSpan;
    s.y = spawnY(s.z);
    s.lastStep = Math.floor(s.y / GLYPH_WORLD);
  }

  function initStreams() {
    streams = [];
    for (let i = 0; i < STREAM_COUNT; i++) {
      // uniform depth distribution, kept sorted far-to-near so painter's
      // algorithm draws background streams first
      const z = Z_FAR - (Z_FAR - Z_NEAR) * (i / (STREAM_COUNT - 1));
      streams.push(makeStream(z));
    }
    for (const s of streams) placeStream(s);
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.textBaseline = 'top';
    ctx.textAlign = 'center';

    focal = height;            // ~53° vertical field of view
    cx = width / 2;
    cy = height * 0.42;        // vanishing point slightly above center: a hint of looking up

    if (!streams.length) initStreams();

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, width, height);
  }

  function step() {
    if (window.innerWidth !== width || window.innerHeight !== height) resize();
    if (!width || !height) return;

    frame++;
    const camX = Math.sin(frame * 0.004) * SWAY;

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, width, height);

    for (const s of streams) {
      const scale = focal / s.z;
      const size = GLYPH_WORLD * scale;
      if (size < 3) continue;

      s.y += s.speed;

      // as the head crosses each glyph-height boundary, shift a fresh glyph in
      const headStep = Math.floor(s.y / GLYPH_WORLD);
      for (let k = s.lastStep; k < headStep; k++) {
        s.chars.pop();
        s.chars.unshift(randomGlyph());
      }
      s.lastStep = headStep;

      if (Math.random() < MUTATE_CHANCE) {
        s.chars[1 + ((Math.random() * (s.chars.length - 1)) | 0)] = randomGlyph();
      }

      // respawn once the entire trail (its topmost glyph) has fallen below the
      // screen — checked before the horizontal cull so streams that are
      // off to the side still recycle instead of falling forever
      const n = s.chars.length;
      const tailSy = cy + (s.y - n * GLYPH_WORLD) * scale;
      if (tailSy > height + size) {
        placeStream(s);
        continue;
      }

      const sx = cx + (s.x - camX) * scale;
      if (sx < -size || sx > width + size) continue;

      ctx.font = `${Math.max(4, Math.round(size))}px "MS Gothic", "Osaka-Mono", "Noto Sans Mono CJK JP", monospace`;

      // fog: near streams at full strength, far ones faded into the murk
      const fog = 0.15 + 0.85 * (Z_FAR - s.z) / (Z_FAR - Z_NEAR);

      for (let i = 0; i < n; i++) {
        const wy = s.y - i * GLYPH_WORLD;
        const sy = cy + wy * scale;
        if (sy < -size || sy > height + size) continue;

        if (i === 0) {
          ctx.fillStyle = `rgba(220, 255, 220, ${fog})`;
          if (size > 14) {
            ctx.shadowColor = '#4f4';
            ctx.shadowBlur = size * 0.5;
          }
          ctx.fillText(s.chars[0], sx, sy);
          ctx.shadowBlur = 0;
        } else {
          const a = Math.pow(1 - i / n, 1.3) * fog;
          ctx.fillStyle = `rgba(0, 255, 136, ${a})`;
          ctx.fillText(s.chars[i], sx, sy);
        }
      }
    }
  }

  let last = 0;
  function loop(now) {
    requestAnimationFrame(loop);
    if (now - last < FRAME_MS) return;
    last = now;
    step();
  }

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 100);
  });

  resize();
  requestAnimationFrame(loop);
  window.__matrixStep = step; // manual frame hook (used for headless testing)
})();
</script>
</body>
</html>
