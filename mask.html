<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matrix Rain — Image Mask</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
  nav {
    position: fixed;
    top: 10px;
    left: 12px;
    z-index: 10;
    font: 12px monospace;
  }
  nav a {
    color: #0f8;
    opacity: 0.4;
    text-decoration: none;
    margin-right: 12px;
  }
  nav a:hover { opacity: 1; }
  nav a.here { opacity: 0.9; text-decoration: underline; }
  #hint {
    position: fixed;
    bottom: 10px;
    left: 12px;
    z-index: 10;
    font: 12px monospace;
    color: #0f8;
    opacity: 0.35;
    cursor: pointer;
  }
  #hint:hover { opacity: 0.9; }
  #file { display: none; }
</style>
</head>
<body>
<nav>
  <a href="index.html">baseline</a><a href="layers.html">layers</a><a href="tilt.html">tilt</a><a href="space.html">3d space</a><a class="here" href="mask.html">mask</a>
</nav>
<label id="hint" for="file">drop an image anywhere (or click here) to use it as the brightness mask</label>
<input id="file" type="file" accept="image/*">
<canvas id="rain"></canvas>
<script>
(() => {
  'use strict';

  const canvas = document.getElementById('rain');
  const ctx = canvas.getContext('2d');

  // Glyph set: half-width katakana (mirrored like the film), digits, and a few latin chars
  const KATAKANA = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ';
  const DIGITS   = '0123456789';
  const LATIN    = 'Z:・."=*+-<>¦|';
  const GLYPHS   = (KATAKANA + DIGITS + LATIN).split('');

  const FONT_SIZE = 18;
  const MUTATE_CHANCE = 0.02;
  const FPS = 30;
  const FRAME_MS = 1000 / FPS;
  const TRAIL_LENGTH = 88;
  const MIN_SPEED = 0.2;
  const MAX_SPEED = 2;
  const MASK_FLOOR = 0.04;  // minimum brightness so dark mask areas keep a whisper of rain
  const MASK_GAMMA = 0.6;   // <1 lifts midtones so the image reads through the rain
  const COLOR_CYCLE = 90;
  const PALETTE = [
    [0, 255, 136],   // console green
    [0, 160, 255],   // neon blue
    [255, 50, 80],   // neon red
  ];

  let columns = [];
  let width = 0, height = 0, dpr = 1;
  let frame = 0;

  // --- brightness mask -----------------------------------------------------
  // maskSource is any drawable (Image or Canvas). It gets cover-scaled onto a
  // tiny offscreen canvas with one pixel per glyph cell; mask[] holds the
  // resulting luminance (0..1) so lookups during drawing are a single index.
  let maskSource = null;
  let mask = null;
  let maskCols = 0, maskRows = 0;

  function rebuildMask() {
    if (!maskSource || !width || !height) return;
    maskCols = Math.ceil(width / FONT_SIZE);
    maskRows = Math.ceil(height / FONT_SIZE) + 1;

    const off = document.createElement('canvas');
    off.width = maskCols;
    off.height = maskRows;
    const octx = off.getContext('2d', { willReadFrequently: true });

    // cover-fit: crop the source to the canvas aspect ratio, centered
    const iw = maskSource.width, ih = maskSource.height;
    const aspect = width / height;
    let sw = iw, sh = iw / aspect;
    if (sh > ih) { sh = ih; sw = ih * aspect; }
    const sx = (iw - sw) / 2, sy = (ih - sh) / 2;
    octx.drawImage(maskSource, sx, sy, sw, sh, 0, 0, maskCols, maskRows);

    const data = octx.getImageData(0, 0, maskCols, maskRows).data;
    mask = new Float32Array(maskCols * maskRows);
    for (let i = 0; i < mask.length; i++) {
      const p = i * 4;
      // rec. 601 luma
      const lum = (data[p] * 0.299 + data[p + 1] * 0.587 + data[p + 2] * 0.114) / 255;
      mask[i] = MASK_FLOOR + (1 - MASK_FLOOR) * Math.pow(lum, MASK_GAMMA);
    }
  }

  function maskAt(c, r) {
    if (!mask) return 1;
    if (c < 0 || c >= maskCols || r < 0 || r >= maskRows) return MASK_FLOOR;
    // ImageData layout is row-major
    return mask[r * maskCols + c];
  }

  // default mask so the page demonstrates the effect with no image needed:
  // the word MATRIX, softly glowing on a dark field
  function makeDefaultMask() {
    const c = document.createElement('canvas');
    c.width = 960;
    c.height = 540;
    const g = c.getContext('2d');
    g.fillStyle = '#161616';
    g.fillRect(0, 0, c.width, c.height);
    g.font = 'bold 190px monospace';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.filter = 'blur(14px)';
    g.fillStyle = '#888';
    g.fillText('MATRIX', c.width / 2, c.height / 2);
    g.filter = 'none';
    g.fillStyle = '#fff';
    g.fillText('MATRIX', c.width / 2, c.height / 2);
    return c;
  }

  function setMaskImage(fileOrBlob) {
    const img = new Image();
    img.onload = () => {
      maskSource = img;
      rebuildMask();
      URL.revokeObjectURL(img.src);
    };
    img.src = URL.createObjectURL(fileOrBlob);
  }

  document.getElementById('file').addEventListener('change', (e) => {
    if (e.target.files[0]) setMaskImage(e.target.files[0]);
  });
  window.addEventListener('dragover', (e) => e.preventDefault());
  window.addEventListener('drop', (e) => {
    e.preventDefault();
    const f = e.dataTransfer.files[0];
    if (f && f.type.startsWith('image/')) setMaskImage(f);
  });

  // --- rain (same engine as index.html, brightness scaled by the mask) -----

  function cycleColor() {
    const phase = (frame / FPS % COLOR_CYCLE) / COLOR_CYCLE * PALETTE.length;
    const i = Math.floor(phase);
    let u = phase - i;
    u = u * u * (3 - 2 * u);
    const from = PALETTE[i % PALETTE.length];
    const to = PALETTE[(i + 1) % PALETTE.length];
    return [
      Math.round(from[0] + (to[0] - from[0]) * u),
      Math.round(from[1] + (to[1] - from[1]) * u),
      Math.round(from[2] + (to[2] - from[2]) * u),
    ];
  }

  function randomGlyph() {
    return GLYPHS[(Math.random() * GLYPHS.length) | 0];
  }

  function makeColumn(x) {
    return {
      x,
      y: -Math.random() * (height / FONT_SIZE) * 2,
      speed: MIN_SPEED + Math.random() * (MAX_SPEED - MIN_SPEED),
      trail: TRAIL_LENGTH + (Math.random() * 22) | 0,
      glyphs: new Map(),
    };
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.font = `${FONT_SIZE}px "MS Gothic", "Osaka-Mono", "Noto Sans Mono CJK JP", monospace`;
    ctx.textBaseline = 'top';

    const count = Math.ceil(width / FONT_SIZE);
    const old = columns;
    columns = [];
    for (let i = 0; i < count; i++) {
      columns.push(old[i] || makeColumn(i * FONT_SIZE));
      columns[i].x = i * FONT_SIZE;
    }

    rebuildMask();

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, width, height);
  }

  function step() {
    if (window.innerWidth !== width || window.innerHeight !== height) resize();
    if (!width || !height) return;

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, width, height);

    frame++;
    const [cr, cg, cb] = cycleColor();
    const headStyle = `rgb(${cr + ((255 - cr) * 0.8 | 0)}, ${cg + ((255 - cg) * 0.8 | 0)}, ${cb + ((255 - cb) * 0.8 | 0)})`;
    const glowStyle = `rgb(${cr}, ${cg}, ${cb})`;

    const rows = Math.ceil(height / FONT_SIZE);

    for (let ci = 0; ci < columns.length; ci++) {
      const col = columns[ci];
      const prevRow = Math.floor(col.y);
      col.y += col.speed;
      const row = Math.floor(col.y);

      for (let r = Math.max(prevRow + 1, 0); r <= Math.min(row, rows); r++) {
        col.glyphs.set(r, randomGlyph());
      }

      if (Math.random() < MUTATE_CHANCE * col.trail && row > 0) {
        const r = row - 1 - ((Math.random() * col.trail) | 0);
        if (col.glyphs.has(r)) col.glyphs.set(r, randomGlyph());
      }

      const tail = row - col.trail;
      for (let r = Math.max(tail, 0); r <= Math.min(row, rows); r++) {
        const glyph = col.glyphs.get(r);
        if (!glyph) continue;

        const b = maskAt(ci, r);
        if (r === row) {
          // head brightness follows the mask; the glow only survives in bright areas
          ctx.globalAlpha = b;
          ctx.fillStyle = headStyle;
          if (b > 0.3) {
            ctx.shadowColor = glowStyle;
            ctx.shadowBlur = 8 * b;
          }
          ctx.fillText(glyph, col.x, r * FONT_SIZE);
          ctx.shadowBlur = 0;
          ctx.globalAlpha = 1;
        } else {
          const a = Math.pow(1 - (row - r) / col.trail, 1.4) * b;
          ctx.fillStyle = `rgba(${cr}, ${cg}, ${cb}, ${a})`;
          ctx.fillText(glyph, col.x, r * FONT_SIZE);
        }
      }

      for (const r of col.glyphs.keys()) {
        if (r < tail) col.glyphs.delete(r);
      }

      if (tail * FONT_SIZE > height) {
        col.y = -Math.random() * 30;
        col.speed = MIN_SPEED + Math.random() * (MAX_SPEED - MIN_SPEED);
        col.trail = TRAIL_LENGTH + (Math.random() * 22) | 0;
        col.glyphs.clear();
      }
    }
  }

  let last = 0;
  function loop(now) {
    requestAnimationFrame(loop);
    if (now - last < FRAME_MS) return;
    last = now;
    step();
  }

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 100);
  });

  maskSource = makeDefaultMask();
  resize();
  requestAnimationFrame(loop);
  window.__matrixStep = step; // manual frame hook (used for headless testing)
})();
</script>
</body>
</html>
